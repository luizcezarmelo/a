<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agenda Diária</title>
<style>
:root{
  --bg:#f3f5f8;--panel:#fff;--ink:#172033;--muted:#6b7280;--line:#dfe4ea;
  --primary:#2563eb;--primary-dark:#1d4ed8;--success:#16a34a;--danger:#dc2626;
  --shadow:0 10px 30px rgba(15,23,42,.08);--radius:16px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
button,input,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
#lockScreen{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;background:linear-gradient(135deg,#111827,#243b63)}
.lock-card{width:min(420px,92vw);background:#fff;border-radius:22px;padding:34px;box-shadow:0 30px 70px rgba(0,0,0,.3);text-align:center}
.lock-logo{width:62px;height:62px;margin:0 auto 18px;border-radius:18px;background:#e8efff;color:var(--primary);display:grid;place-items:center;font-size:30px;font-weight:800}
.lock-card h1{margin:0 0 8px;font-size:26px}.lock-card p{margin:0 0 22px;color:var(--muted)}
.pin{display:flex;justify-content:center;gap:10px;margin:18px 0}.pin input{width:58px;height:62px;text-align:center;font-size:28px;font-weight:800;border:2px solid var(--line);border-radius:12px;outline:none}
.pin input:focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(37,99,235,.12)}.pin-error{min-height:22px;color:var(--danger);font-weight:700;font-size:13px}
.primary-btn{border:0;background:var(--primary);color:#fff;padding:11px 16px;border-radius:11px;font-weight:800}.primary-btn:hover{background:var(--primary-dark)}
.topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.topbar-inner{max-width:1500px;margin:auto;padding:14px 20px;display:flex;gap:16px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:11px;min-width:220px}.brand-icon{width:42px;height:42px;border-radius:12px;background:#e8efff;color:var(--primary);display:grid;place-items:center;font-weight:900}
.brand h1{font-size:19px;margin:0}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.tool-btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 12px;border-radius:10px;font-weight:750}
.tool-btn:hover{border-color:#b9c2ce;background:#f8fafc}.tool-btn.today{background:#eef4ff;color:var(--primary);border-color:#cddcff}
.tool-btn.migrate{background:#fff7e6;color:#9a5b00;border-color:#f6d48d}
.search-wrap{max-width:1500px;margin:auto;padding:0 20px 14px;position:relative}.search{width:100%;height:43px;border:1px solid var(--line);border-radius:11px;padding:0 15px 0 42px;background:#f8fafc;outline:none;text-transform:uppercase}
.search:focus{background:#fff;border-color:var(--primary);box-shadow:0 0 0 4px rgba(37,99,235,.08)}.search-icon{position:absolute;left:34px;top:12px;color:#7b8491}
.layout{max-width:1500px;margin:0 auto;padding:18px 20px 28px;display:grid;grid-template-columns:300px minmax(0,1fr);gap:18px}.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.calendar-card{padding:16px;align-self:start;position:sticky;top:116px}.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-title{font-size:17px;font-weight:900;text-transform:capitalize}.icon-btn{width:34px;height:34px;border:1px solid var(--line);background:#fff;border-radius:9px;font-weight:900;color:#475569}
.icon-btn:hover{background:#f8fafc}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:4px}.week span{text-align:center;font-size:10px;font-weight:900;color:#8993a1;padding:6px 0}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.day{height:35px;border:0;background:transparent;border-radius:9px;font-weight:700;color:#3f4957}
.day:hover{background:#f1f5f9}.day.other{color:#b8bec8}.day.today{box-shadow:inset 0 0 0 2px #93b4ff;color:var(--primary)}.day.selected{background:var(--primary);color:#fff}.day.selected.today{box-shadow:none}
.calendar-actions{display:grid;grid-template-columns:1fr;gap:7px;margin-top:14px;padding-top:13px;border-top:1px solid var(--line)}
.calendar-actions .tool-btn{width:100%;text-align:center}
.main{min-width:0}.date-header{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:13px}.date-title{font-size:24px;font-weight:900}.date-title small{display:block;font-size:12px;color:var(--muted);font-weight:650;margin-top:4px}.status{font-size:12px;color:var(--muted);font-weight:700}
.agenda-card{padding:12px}.commitment{border:1px solid var(--line);border-radius:13px;margin:7px 0;background:#fff;overflow:hidden;transition:.15s}
.commitment.highlight{border-color:#f4b4b4;background:#fff8f8;box-shadow:0 4px 16px rgba(220,38,38,.08)}
.commitment.done{background:#f9fcfa;border-color:#d5e9da}.commitment.done .main-input{text-decoration:line-through;color:#8a929d}.commitment.done .commitment-head{background:#fbfdfb}
.commitment-head{display:grid;grid-template-columns:34px 27px 30px minmax(0,1fr) auto;gap:6px;align-items:center;padding:7px}.index{font-size:12px;font-weight:900;color:#8a94a2;text-align:center}.plus-sub{height:28px;width:27px;border:1px solid var(--line);background:#fff;border-radius:7px;display:grid;place-items:center;font-size:19px;line-height:1;color:#5f6b79;font-weight:500}.plus-sub:hover{background:#f1f5f9;color:var(--primary);border-color:#b9c8df}
.check-btn,.del-btn,.star-btn,.move-btn{height:32px;border:1px solid var(--line);background:#fff;border-radius:8px;display:grid;place-items:center;font-weight:900}
.check-btn{color:#718096}.check-btn:hover{background:#f1f5f9}.commitment.done .check-btn{background:#edf8f0;color:#4b9b5e;border-color:#cfe6d4;box-shadow:inset 0 0 0 1px rgba(75,155,94,.04)}.del-btn{color:#b42318}.del-btn:hover{background:#fff1f1}
.star-btn{color:#a36a00}.star-btn.active{background:#fff0f0;color:#dc2626;border-color:#f2b4b4}
.move-btn{width:28px;color:#475569}.move-btn:hover{background:#f1f5f9}.move-btn:disabled{opacity:.35;cursor:not-allowed;background:#fff}
.main-input,.sub-input{width:100%;border:1px solid var(--line);outline:0;background:#fff;color:var(--ink);font-weight:750;min-width:0;text-transform:uppercase;border-radius:7px;padding:7px 9px;box-shadow:inset 0 1px 2px rgba(15,23,42,.03)}
.main-input{font-size:14px;padding:8px 4px}.sub-input{font-size:13px;padding:7px 9px}.main-input::placeholder,.sub-input::placeholder{color:#a4acb7;font-weight:600}
.subs{display:block;border-top:1px solid #edf0f3;background:#fbfcfd;padding:4px 7px 7px 71px}.commitment.expanded .subs{display:block}
.sub-row{display:grid;grid-template-columns:27px 30px minmax(0,1fr) 30px;gap:6px;align-items:center;padding:3px 0}.sub-index{font-size:11px;color:#8b95a2;font-weight:850}
.sub-check,.sub-del{height:29px;border:1px solid var(--line);background:#fff;border-radius:7px;font-weight:900;display:grid;place-items:center}.sub-check{color:#718096}
.sub-row.done .sub-check{background:#edf8f0;color:#4b9b5e;border-color:#cfe6d4}.sub-row.done{background:#fbfdfb}.sub-row.done .sub-input{text-decoration:line-through;color:#77808d}.sub-del{color:#b42318}
.add-sub{display:none}
.bottom-grid{display:grid;grid-template-columns:1fr;gap:18px;margin-top:18px}.info-card{padding:15px}.info-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px}.info-head h2{font-size:15px;margin:0}.info-head span{font-size:10px;color:var(--muted);font-weight:800}
.notes{width:100%;min-height:190px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:10px;outline:none;text-transform:uppercase}.notes:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.08)}
.save-state{font-size:10px;color:var(--muted);text-align:right;margin-top:7px}
.search-results{position:absolute;left:20px;right:20px;top:51px;background:#fff;border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow);z-index:30;max-height:360px;overflow:auto}
.result{padding:10px 13px;border-bottom:1px solid #eef1f4;cursor:pointer}.result:last-child{border-bottom:0}.result:hover{background:#f8fafc}.result strong{display:block;font-size:12px}.result small{color:var(--muted);font-size:10px}
.empty-search{padding:16px;color:var(--muted);font-size:12px;text-align:center}
.toast{position:fixed;right:20px;bottom:20px;z-index:200;padding:12px 15px;background:#172033;color:#fff;border-radius:10px;box-shadow:var(--shadow);font-size:12px;font-weight:750;opacity:0;transform:translateY(10px);pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translateY(0)}
@media(max-width:980px){.layout{grid-template-columns:1fr}.calendar-card{position:static}.bottom-grid{grid-template-columns:1fr}.topbar-inner{align-items:flex-start;flex-direction:column}.actions{justify-content:flex-start}}
@media(max-width:620px){.layout{padding:12px}.search-wrap{padding:0 12px 12px}.commitment-head{grid-template-columns:28px 28px minmax(0,1fr) 30px}.subs{padding-left:58px}.date-title{font-size:20px}.move-btn{width:24px;height:28px}.check-btn,.del-btn,.star-btn{height:28px}}
</style>
</head>
<body>
<div id="lockScreen">
  <div class="lock-card">
    <div class="lock-logo">✓</div>
    <h1 id="lockTitle">AGENDA DIÁRIA</h1>
    <p id="lockText">CRIE UMA SENHA DE 4 NÚMEROS PARA PROTEGER SUA AGENDA.</p>
    <div class="pin" id="pinBox">
      <input inputmode="numeric" maxlength="1" autocomplete="one-time-code">
      <input inputmode="numeric" maxlength="1" autocomplete="off">
      <input inputmode="numeric" maxlength="1" autocomplete="off">
      <input inputmode="numeric" maxlength="1" autocomplete="off">
    </div>
    <div class="pin-error" id="pinError"></div>
    <button class="primary-btn" id="pinAction">CRIAR SENHA</button>
  </div>
</div>

<div class="app hidden" id="app">
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand"><div class="brand-icon">✓</div><div><h1>AGENDA DIÁRIA</h1><small>COMPROMISSOS E SUBCOMPROMISSOS</small></div></div>
  </div>
  <div class="search-wrap">
    <span class="search-icon">⌕</span>
    <input class="search" id="search" type="search" minlength="4" placeholder="PESQUISAR COMPROMISSOS (MÍNIMO 4 CARACTERES)" autocomplete="off">
    <div class="search-results hidden" id="searchResults"></div>
  </div>
</header>

<div class="layout">
<aside class="calendar-card card">
  <div class="cal-head"><button class="icon-btn" id="calPrev">‹</button><div class="cal-title" id="calTitle"></div><button class="icon-btn" id="calNext">›</button></div>
  <div class="week"><span>DOM</span><span>SEG</span><span>TER</span><span>QUA</span><span>QUI</span><span>SEX</span><span>SÁB</span></div>
  <div class="days" id="days"></div>
  <div class="calendar-actions">
    <button class="tool-btn today" id="todayBtnCal">HOJE</button>
    <button class="tool-btn migrate" id="migrateBtnCal">↗ MIGRAR</button>
    <button class="tool-btn" id="lockBtnCal">🔒 BLOQUEAR</button>
  </div>
</aside>

<main class="main">
  <div class="date-header"><div class="date-title" id="dateTitle"></div><div class="status" id="saveStatus">SINCRONIZANDO...</div></div>
  <section class="agenda-card card" id="agendaList"></section>
  <div class="bottom-grid">
    <section class="info-card card">
      <div class="info-head"><h2>📝 ANOTAÇÕES GERAIS</h2><span>FIXO — VALE PARA TODOS OS DIAS</span></div>
      <textarea class="notes" id="notes" placeholder="DIGITE ANOTAÇÕES GERAIS..."></textarea>
      <div class="save-state">SALVAMENTO AUTOMÁTICO.</div>
    </section>
  </div>
</main>
</div>
</div>
<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDQOGFiqafMZh0ha6XW62P1DpIKJE8TBYc",
  authDomain: "agenda-online-7b71c.firebaseapp.com",
  databaseURL: "https://agenda-online-7b71c-default-rtdb.firebaseio.com",
  projectId: "agenda-online-7b71c",
  storageBucket: "agenda-online-7b71c.firebasestorage.app",
  messagingSenderId: "28125733214",
  appId: "1:28125733214:web:162d1cce5d14f55c24afcf"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// Camada de compatibilidade: reproduz a mesma assinatura da API modular
// (ref/get/set/onValue) usada no restante do código, mas por cima do SDK
// "compat" carregado acima via <script> comum. Isso evita o import de módulo
// ES, que os navegadores bloqueiam ao abrir o arquivo direto do disco
// (file://) — assim o app funciona com duplo-clique, sem precisar de servidor.
function ref(database,path){ return database.ref(path); }
function get(reference){ return reference.once("value"); }
function set(reference,value){ return reference.set(value); }
function onValue(reference,onNext,onError){
  reference.on("value",onNext,onError);
  return () => reference.off("value",onNext);
}

const ROOT = "agenda_diaria";
const $ = id => document.getElementById(id);

const toLocalISO = d => { const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), day=String(d.getDate()).padStart(2,"0"); return `${y}-${m}-${day}`; };
const todayISO = () => toLocalISO(new Date());
const addDays = (iso,n) => { const d=new Date(iso+"T12:00:00"); d.setDate(d.getDate()+n); return toLocalISO(d); };
// Usado só pelo botão Migrar: pula sábado e domingo (0=domingo, 6=sábado).
// O calendário, a busca e o restante do app continuam usando addDays normalmente.
const nextWorkDay = iso => {
  let d=addDays(iso,1);
  while([0,6].includes(new Date(d+"T12:00:00").getDay())) d=addDays(d,1);
  return d;
};
const escapeHTML = (s="") => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = iso => new Intl.DateTimeFormat("pt-BR",{weekday:"long",day:"2-digit",month:"long",year:"numeric"}).format(new Date(iso+"T12:00:00"));
const fmtShort = iso => new Intl.DateTimeFormat("pt-BR",{day:"2-digit",month:"2-digit",year:"numeric"}).format(new Date(iso+"T12:00:00"));
const monthName = d => new Intl.DateTimeFormat("pt-BR",{month:"long",year:"numeric"}).format(d);

let selectedDate=todayISO(), calendarMonth=new Date(selectedDate+"T12:00:00"), today=selectedDate;
let dataCache={}, unsubscribeSelected=null, savingTimer=null, pinMode="create", pinHash=null;

async function sha256(text){
  const hash=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(text));
  return [...new Uint8Array(hash)].map(b=>b.toString(16).padStart(2,"0")).join("");
}
function clearPin(){document.querySelectorAll("#pinBox input").forEach(i=>i.value="");document.querySelector("#pinBox input").focus();}
async function initLock(){
  pinHash=localStorage.getItem("agenda_pin_hash");
  pinMode=pinHash?"login":"create";
  $("lockTitle").textContent=pinHash?"AGENDA BLOQUEADA":"PRIMEIRO ACESSO";
  $("lockText").textContent=pinHash?"DIGITE SUA SENHA DE 4 NÚMEROS.":"CRIE UMA SENHA DE 4 NÚMEROS PARA PROTEGER SUA AGENDA.";
  $("pinAction").textContent=pinHash?"ENTRAR":"CRIAR SENHA";
  $("lockScreen").classList.remove("hidden"); clearPin();
}
async function submitPin(){
  if(!(window.crypto && window.crypto.subtle)){
    $("pinError").textContent="SEU NAVEGADOR/CONEXÃO NÃO PERMITE CRIPTOGRAFIA SEGURA (ACESSE VIA HTTPS).";
    return;
  }
  const pin=[...document.querySelectorAll("#pinBox input")].map(i=>i.value).join("");
  if(!/^\d{4}$/.test(pin)){ $("pinError").textContent="DIGITE EXATAMENTE 4 NÚMEROS."; return; }
  const hash=await sha256(pin);
  if(pinMode==="create"){
    localStorage.setItem("agenda_pin_hash",hash); pinHash=hash;
  }else if(hash!==pinHash){
    $("pinError").textContent="SENHA INCORRETA."; clearPin(); return;
  }
  $("pinError").textContent=""; $("lockScreen").classList.add("hidden"); $("app").classList.remove("hidden");
  await startApp();
}
document.querySelectorAll("#pinBox input").forEach((input,index,all)=>{
  input.addEventListener("input",()=>{input.value=input.value.replace(/\D/g,"").slice(0,1);if(input.value&&index<all.length-1)all[index+1].focus();});
  input.addEventListener("keydown",e=>{if(e.key==="Backspace"&&!input.value&&index>0)all[index-1].focus();if(e.key==="Enter")submitPin();});
});
$("pinAction").addEventListener("click",submitPin);

function defaultDay(){
  return {commitments:Array.from({length:20},()=>({text:"",done:false,highlight:false,subs:Array.from({length:10},()=>({text:"",done:false,active:false}))}))};
}
function normalizeDay(raw){
  const base=defaultDay();
  if(raw&&Array.isArray(raw.commitments)) for(let i=0;i<20;i++){
    const c=raw.commitments[i]||{};
    base.commitments[i].text=typeof c.text==="string"?c.text:"";
    base.commitments[i].done=!!c.done; base.commitments[i].highlight=!!c.highlight;
    if(Array.isArray(c.subs)) for(let j=0;j<10;j++){
      const s=c.subs[j]||{}; base.commitments[i].subs[j]={text:typeof s.text==="string"?s.text:"",done:!!s.done,active:!!s.active||!!s.text||!!s.done};
    }
  }
  return base;
}
function compactDay(day){
  day.commitments.forEach(c=>{
    const subs=Array.isArray(c.subs)?c.subs:[];
    const used=subs.filter(s=>s && (s.active||s.text||s.done)).map(s=>({
      text:typeof s.text==='string'?s.text:'',
      done:!!s.done,
      active:true
    }));
    while(used.length<10)used.push({text:'',done:false,active:false});
    c.subs=used.slice(0,10);
  });
  const filled=day.commitments.filter(c=>c.text||c.done||c.highlight||c.subs.some(s=>s.active||s.text||s.done));
  while(filled.length<20)filled.push({text:'',done:false,highlight:false,subs:Array.from({length:10},()=>({text:'',done:false,active:false}))});
  day.commitments=filled.slice(0,20);
  return day;
}

// Reordena os compromissos de um dia colocando os que têm estrela (highlight)
// primeiro, mantendo a ordem relativa dentro de cada grupo (estrela / sem estrela).
// Não mexe em subcompromissos nem em nenhuma outra propriedade.
function sortByStar(day){
  day.commitments = day.commitments
    .map((c,idx)=>({c,idx}))
    .sort((a,b)=>{
      const ah=a.c.highlight?0:1, bh=b.c.highlight?0:1;
      if(ah!==bh) return ah-bh;
      return a.idx-b.idx;
    })
    .map(x=>x.c);
}

async function loadDay(date){
  const snap=await get(ref(db,`${ROOT}/days/${date}`));
  return normalizeDay(snap.exists()?snap.val():null);
}
function watchSelectedDay(){
  if(unsubscribeSelected)unsubscribeSelected();
  unsubscribeSelected=onValue(ref(db,`${ROOT}/days/${selectedDate}`),snap=>{
    dataCache[selectedDate]=normalizeDay(snap.exists()?snap.val():null);
    const typing=document.activeElement?.matches?.('.main-input,.sub-input');
    if(!typing)renderAgenda();
    $("saveStatus").textContent="SALVO / SINCRONIZADO";
  },()=>{ $("saveStatus").textContent="ERRO DE SINCRONIZAÇÃO"; toast("NÃO FOI POSSÍVEL SINCRONIZAR COM O FIREBASE."); });
}
function saveSelectedDay(){
  const data=normalizeDay(dataCache[selectedDate]); dataCache[selectedDate]=data; $("saveStatus").textContent="SALVANDO...";
  set(ref(db,`${ROOT}/days/${selectedDate}`),data).then(()=>$("saveStatus").textContent="SALVO / SINCRONIZADO").catch(()=>$("saveStatus").textContent="ERRO AO SALVAR");
}
function scheduleSave(){clearTimeout(savingTimer);$("saveStatus").textContent="ALTERAÇÕES PENDENTES...";savingTimer=setTimeout(saveSelectedDay,350);}

// As anotações gerais agora ficam num único registro fixo no banco
// (agenda_diaria/generalNotes), sem nenhuma data envolvida — por isso
// valem para todos os dias e não "somem" ao virar o dia.
async function loadNotes(){
  const snap=await get(ref(db,`${ROOT}/generalNotes`));
  $("notes").value=snap.exists()?(snap.val()||""):"";
}
function saveNotes(){
  set(ref(db,`${ROOT}/generalNotes`),$("notes").value||"").catch(()=>toast("ERRO AO SALVAR ANOTAÇÕES."));
}
$("notes").addEventListener("input",()=>{
  const el=$("notes"), start=el.selectionStart, end=el.selectionEnd;
  el.value=el.value.toUpperCase();
  el.setSelectionRange(start,end);
  saveNotes();
});

function moveCommitment(index,direction){
  const target=index+direction;
  if(target<0||target>=20)return;
  const data=dataCache[selectedDate]||defaultDay();
  const arr=data.commitments;
  const tmp=arr[index]; arr[index]=arr[target]; arr[target]=tmp;
  dataCache[selectedDate]=data;
  renderAgenda();
  scheduleSave();
}

function renderAgenda(){
  const data=dataCache[selectedDate]||defaultDay();

  // Compacta primeiro os subcompromissos: nenhum vazio pode ficar entre os preenchidos.
  // Os itens preenchidos sobem mantendo a ordem; os vazios ficam no final.
  compactDay(data);

  // Guarda o foco/cursor para que o autosave do Firebase não interrompa a digitação.
  const active=document.activeElement;
  const activeCard=active?.closest?.('.commitment');
  const activeIndex=activeCard?.dataset.index;
  const activeSub=active?.dataset?.sub;
  const activeMain=active?.hasAttribute?.('data-main');
  const cursorStart=active?.selectionStart ?? null;
  const cursorEnd=active?.selectionEnd ?? null;

  $('agendaList').innerHTML=data.commitments.map((c,i)=>{
    let subHTML='';
    for(let j=0;j<10;j++){
      const sub=c.subs[j]||{text:'',done:false,active:false};
      if(!sub.active && !sub.text && !sub.done) break;
      subHTML+=`<div class="sub-row ${sub.done?'done':''}">
        <div class="sub-index">${i+1}.${j+1}</div>
        <button type="button" class="sub-check" title="CONFIRMAR / MARCAR SUBCOMPROMISSO" aria-label="CONFIRMAR SUBCOMPROMISSO" data-sub-check="${j}">✓</button>
        <input class="sub-input" data-sub="${j}" value="${escapeHTML(sub.text)}" autocomplete="off" spellcheck="false">
        <button type="button" class="sub-del" title="APAGAR SUBCOMPROMISSO" data-sub-delete="${j}">×</button>
      </div>`;
    }

    return `<article class="commitment ${c.done?'done':''} ${c.highlight?'highlight':''}" data-index="${i}">
      <div class="commitment-head">
        <div class="index">${String(i+1).padStart(2,'0')}</div>
        <button type="button" class="plus-sub" title="CRIAR SUBCOMPROMISSO" data-plus-sub>+</button>
        <button type="button" class="check-btn" title="CONFIRMAR / MARCAR CONCLUÍDO" aria-label="CONFIRMAR COMPROMISSO" data-action="check">✓</button>
        <input class="main-input" data-main="${i}" value="${escapeHTML(c.text)}" placeholder="" autocomplete="off" spellcheck="false">
        <div style="display:flex;gap:5px">
          <button type="button" class="star-btn ${c.highlight?'active':''}" title="DESTACAR">${c.highlight?'★':'☆'}</button>
          <button type="button" class="move-btn" title="MOVER PARA CIMA" aria-label="MOVER COMPROMISSO PARA CIMA" data-action="move-up" ${i===0?'disabled':''}>↑</button>
          <button type="button" class="move-btn" title="MOVER PARA BAIXO" aria-label="MOVER COMPROMISSO PARA BAIXO" data-action="move-down" ${i===19?'disabled':''}>↓</button>
          <button type="button" class="del-btn" title="APAGAR COMPROMISSO" data-action="delete">×</button>
        </div>
      </div>
      <div class="subs">${subHTML}</div>
    </article>`;
  }).join('');

  bindAgendaEvents();

  if(activeIndex!==undefined){
    let target=null;
    if(activeSub!==undefined) target=document.querySelector(`.commitment[data-index="${activeIndex}"] [data-sub="${activeSub}"]`);
    else if(activeMain) target=document.querySelector(`.commitment[data-index="${activeIndex}"] [data-main]`);
    if(target){
      target.focus({preventScroll:true});
      if(cursorStart!==null && typeof target.setSelectionRange==='function') target.setSelectionRange(cursorStart,cursorEnd??cursorStart);
    }
  }
}

function bindAgendaEvents(){
  // Os eventos usam sempre o índice atual em dataCache. Isso evita referências
  // antigas quando o Firebase envia uma atualização depois de criar um sub.
  document.querySelectorAll('.commitment').forEach(card=>{
    const i=Number(card.dataset.index);

    const getCommitment=()=>{
      const data=dataCache[selectedDate]||defaultDay();
      if(!dataCache[selectedDate]) dataCache[selectedDate]=data;
      return data.commitments[i];
    };

    card.querySelector('[data-action=check]').onclick=(e)=>{
      e.preventDefault();
      e.stopPropagation();
      const c=getCommitment();
      if(!c)return;
      c.done=!c.done;
      renderAgenda();
      scheduleSave();
    };

    card.querySelector('.star-btn').onclick=(e)=>{
      e.preventDefault();
      e.stopPropagation();
      const data=dataCache[selectedDate]||defaultDay();
      if(!dataCache[selectedDate]) dataCache[selectedDate]=data;
      const c=data.commitments[i];
      if(!c)return;
      c.highlight=!c.highlight;
      // Só reordena quando a estrela está sendo LIGADA: o compromisso sobe
      // para ficar logo abaixo do último já marcado com estrela (ou vira o
      // primeiro, se nenhum outro tiver estrela). Ao desmarcar, a posição
      // não muda.
      if(c.highlight) sortByStar(data);
      renderAgenda();
      scheduleSave();
    };

    card.querySelector('[data-action="move-up"]').onclick=(e)=>{
      e.preventDefault();
      e.stopPropagation();
      moveCommitment(i,-1);
    };

    card.querySelector('[data-action="move-down"]').onclick=(e)=>{
      e.preventDefault();
      e.stopPropagation();
      moveCommitment(i,1);
    };

    card.querySelector('[data-action=delete]').onclick=(e)=>{
      e.preventDefault();
      e.stopPropagation();
      const data=dataCache[selectedDate]||defaultDay();
      const c=data.commitments[i];
      if(!c)return;
      const hasData=c.text||c.done||c.highlight||c.subs.some(s=>s.active||s.text||s.done);
      if(hasData&&!confirm(`APAGAR O COMPROMISSO ${i+1} E TODOS OS SEUS SUBCOMPROMISSOS?`))return;
      data.commitments.splice(i,1);
      data.commitments.push({text:'',done:false,highlight:false,subs:Array.from({length:10},()=>({text:'',done:false,active:false}))});
      renderAgenda();
      scheduleSave();
    };

    card.querySelector('[data-plus-sub]').onclick=(e)=>{
      e.preventDefault();
      e.stopPropagation();
      const c=getCommitment();
      if(!c)return;
      const j=c.subs.findIndex(s=>!s.active&&!s.text&&!s.done);
      if(j<0){toast('LIMITE DE 10 SUBCOMPROMISSOS ATINGIDO.');return;}
      c.subs[j].active=true;
      renderAgenda();
      scheduleSave();
      setTimeout(()=>document.querySelector(`.commitment[data-index="${i}"] [data-sub="${j}"]`)?.focus({preventScroll:true}),0);
    };

    const main=card.querySelector('[data-main]');
    main.oninput=e=>{
      const c=getCommitment();
      if(!c)return;
      const el=e.target, start=el.selectionStart, end=el.selectionEnd;
      el.value=el.value.toUpperCase();
      el.setSelectionRange(start,end);
      c.text=el.value;
      scheduleSave();
    };

    main.onkeydown=e=>{
      if(e.key!=='Enter')return;
      e.preventDefault();
      e.stopPropagation();
      const first=card.querySelector('[data-sub="0"]');
      if(first) first.focus({preventScroll:true});
      else document.querySelector(`.commitment[data-index="${Math.min(i+1,19)}"] [data-main]`)?.focus({preventScroll:true});
    };

    card.querySelectorAll('[data-sub]').forEach(input=>{
      const j=Number(input.dataset.sub);
      input.oninput=e=>{
        const c=getCommitment();
        if(!c||!c.subs[j])return;
        const el=e.target, start=el.selectionStart, end=el.selectionEnd;
        el.value=el.value.toUpperCase();
        el.setSelectionRange(start,end);
        c.subs[j].text=el.value;
        c.subs[j].active=true;
        scheduleSave();
      };
      input.onkeydown=e=>{
        if(e.key!=='Enter')return;
        e.preventDefault();
        e.stopPropagation();
        const next=card.querySelector(`[data-sub="${j+1}"]`);
        if(next) next.focus({preventScroll:true});
        else document.querySelector(`.commitment[data-index="${Math.min(i+1,19)}"] [data-main]`)?.focus({preventScroll:true});
      };
    });

    card.querySelectorAll('[data-sub-check]').forEach(btn=>btn.onclick=(e)=>{
      e.preventDefault();
      e.stopPropagation();
      const c=getCommitment();
      const j=Number(btn.dataset.subCheck);
      if(!c||!c.subs[j])return;
      c.subs[j].done=!c.subs[j].done;
      c.subs[j].active=true;
      renderAgenda();
      scheduleSave();
    });

    card.querySelectorAll('[data-sub-delete]').forEach(btn=>btn.onclick=(e)=>{
      e.preventDefault();
      e.stopPropagation();
      const c=getCommitment();
      const j=Number(btn.dataset.subDelete);
      if(!c||!c.subs[j])return;
      c.subs.splice(j,1);
      c.subs.push({text:'',done:false,active:false});
      renderAgenda();
      scheduleSave();
    });
  });
}
function renderCalendar(){
  $("calTitle").textContent=monthName(calendarMonth);
  const y=calendarMonth.getFullYear(),m=calendarMonth.getMonth(),start=new Date(y,m,1).getDay();
  $("days").innerHTML=Array.from({length:42},(_,i)=>{
    const d=new Date(y,m,i-start+1),iso=toLocalISO(d),other=d.getMonth()!==m;
    const cls=`day ${other?"other":""} ${iso===todayISO()?"today":""} ${iso===selectedDate?"selected":""}`;
    return `<button class="${cls}" data-date="${iso}">${d.getDate()}</button>`;
  }).join("");
  $("days").querySelectorAll("[data-date]").forEach(b=>b.onclick=()=>selectDate(b.dataset.date));
}
async function selectDate(date){
  selectedDate=date;calendarMonth=new Date(date+"T12:00:00");$("dateTitle").innerHTML=`${fmtDate(date)}<small>COMPROMISSOS DO DIA SELECIONADO</small>`;
  renderCalendar();if(!dataCache[date])dataCache[date]=await loadDay(date);watchSelectedDay();renderAgenda();
}
$("calPrev").onclick=()=>{calendarMonth.setMonth(calendarMonth.getMonth()-1);renderCalendar();};
$("calNext").onclick=()=>{calendarMonth.setMonth(calendarMonth.getMonth()+1);renderCalendar();};
$("todayBtnCal").onclick=()=>selectDate(todayISO());
$("lockBtnCal").onclick=()=>{ $("app").classList.add("hidden"); $("lockScreen").classList.remove("hidden"); pinMode="login"; $("lockTitle").textContent="AGENDA BLOQUEADA"; $("lockText").textContent="DIGITE SUA SENHA DE 4 NÚMEROS."; $("pinAction").textContent="ENTRAR"; $("pinError").textContent=""; clearPin(); };

$("migrateBtnCal").onclick=async()=>{
  // Cancela qualquer salvamento pendente do dia atualmente selecionado — vamos
  // gravar a versão final explicitamente ao fim desta função.
  clearTimeout(savingTimer);

  const current=selectedDate;
  const next=nextWorkDay(current);

  // Usa sempre o que está em memória (mais atual que o Firebase, pois inclui
  // digitações recentes ainda não sincronizadas) e só busca do Firebase se o
  // dia nunca foi carregado nesta sessão.
  const cd=compactDay(normalizeDay(dataCache[current]||await loadDay(current)));
  const nd=compactDay(normalizeDay(dataCache[next]||await loadDay(next)));

  let moved=0;
  for(let i=0;i<20;i++){
    const c=cd.commitments[i];
    if(c.done || !c.text) continue; // só migra compromissos com texto que ainda não foram concluídos

    // Tenta manter o mesmo índice no dia seguinte; se ocupado, procura o primeiro slot livre.
    let targetIndex = (!nd.commitments[i].text && !nd.commitments[i].done) ? i : nd.commitments.findIndex(x=>!x.text&&!x.done);
    if(targetIndex===-1) continue; // sem espaço no dia seguinte — o item permanece pendente, nada é perdido

    // Copia o compromisso inteiro (texto + todos os subcompromissos, taxados ou não) para o dia seguinte.
    nd.commitments[targetIndex]={
      text:c.text,
      done:false,
      highlight:c.highlight,
      subs:c.subs.map(s=>({text:s.text,done:s.done,active:s.active||!!s.text||s.done}))
    };
    c.done=true;
    moved++;
  }

  // Reaplica a ordenação por estrela no dia de destino: compromissos migrados
  // com estrela entram já posicionados no topo (abaixo das estrelas que já
  // existirem lá), em vez de ficarem apenas no primeiro slot vazio.
  if(moved) sortByStar(nd);

  dataCache[current]=cd;
  dataCache[next]=nd;

  try{
    await set(ref(db,`${ROOT}/days/${current}`),cd);
    await set(ref(db,`${ROOT}/days/${next}`),nd);
  }catch{
    toast("ERRO AO SALVAR A MIGRAÇÃO NO FIREBASE.");
    return;
  }

  if(selectedDate===current) renderAgenda();
  toast(moved?`${moved} COMPROMISSO(S) MIGRADO(S) PARA ${fmtShort(next)}.`:"NÃO HÁ COMPROMISSOS PENDENTES PARA MIGRAR.");
};

let searchDebounceTimer=null, searchToken=0;
$("search").oninput=e=>{
  const el=e.target, start=el.selectionStart, end=el.selectionEnd;
  el.value=el.value.toUpperCase();
  el.setSelectionRange(start,end);
  const q=el.value.trim(),box=$("searchResults");
  clearTimeout(searchDebounceTimer);
  searchToken++; // qualquer busca em andamento vira obsoleta a partir daqui
  if(q.length<4){box.classList.add("hidden");box.innerHTML="";return;}
  box.innerHTML=`<div class="empty-search">PESQUISANDO...</div>`;
  box.classList.remove("hidden");
  searchDebounceTimer=setTimeout(()=>runSearch(q),300);
};
async function runSearch(q){
  const myToken=searchToken, box=$("searchResults");
  const dates=new Set(Object.keys(dataCache));for(let k=-45;k<=45;k++)dates.add(addDays(todayISO(),k));
  const entries=await Promise.all([...dates].map(async date=>{
    let d=dataCache[date];
    if(!d){try{d=await loadDay(date);dataCache[date]=d;}catch{return null;}}
    return {date,d};
  }));
  if(myToken!==searchToken)return; // usuário já digitou outra coisa; descarta este resultado desatualizado
  const results=[];
  entries.forEach(entry=>{
    if(!entry)return;
    const {date,d}=entry;
    d.commitments.forEach((c,i)=>{if(c.text.includes(q))results.push({date,i,sub:null,text:c.text});c.subs.forEach((s,j)=>{if(s.text.includes(q))results.push({date,i,sub:j,text:s.text});});});
  });
  box.innerHTML=results.length?results.slice(0,80).map(r=>`<div class="result" data-result-date="${r.date}" data-result-i="${r.i}" data-result-sub="${r.sub??""}"><strong>${escapeHTML(r.text)}</strong><small>${fmtShort(r.date)} · ${r.sub===null?"COMPROMISSO "+(r.i+1):"SUBCOMPROMISSO "+(r.i+1)+"."+(r.sub+1)}</small></div>`).join(""):`<div class="empty-search">NENHUM RESULTADO ENCONTRADO.</div>`;
  box.classList.remove("hidden");
}
$("searchResults").onclick=async e=>{
  const r=e.target.closest(".result");if(!r)return;
  await selectDate(r.dataset.resultDate);const i=Number(r.dataset.resultI),j=r.dataset.resultSub===""?null:Number(r.dataset.resultSub),card=document.querySelector(`.commitment[data-index="${i}"]`);
  if(card){card.classList.add("expanded");const target=j===null?card.querySelector("[data-main]"):card.querySelector(`[data-sub="${j}"]`);target?.focus();target?.scrollIntoView({behavior:"smooth",block:"center"});}
  $("searchResults").classList.add("hidden");$("search").value="";
};
document.addEventListener("click",e=>{if(!e.target.closest(".search-wrap"))$("searchResults").classList.add("hidden");});

function toast(msg){const t=$("toast");t.textContent=msg;t.classList.add("show");clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove("show"),3200);}
async function startApp(){
  today=todayISO();selectedDate=today;calendarMonth=new Date(today+"T12:00:00");renderCalendar();
  $("dateTitle").innerHTML=`${fmtDate(today)}<small>COMPROMISSOS DO DIA SELECIONADO</small>`;
  dataCache[today]=await loadDay(today);watchSelectedDay();renderAgenda();await loadNotes();
  if(!(await get(ref(db,`${ROOT}/days/${today}`))).exists())await set(ref(db,`${ROOT}/days/${today}`),defaultDay());
}
initLock();
</script>
